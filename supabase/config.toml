# Local Supabase CLI settings. Production auth URLs are set in the dashboard.
project_id = "moji"

[auth]
site_url = "https://moji.locker"
additional_redirect_urls = ["http://localhost:5173"]

# Called from the browser with the publishable key (not a JWT), so the platform
# JWT check is off; the function enforces its own origin check and rate limits.
[functions.generate-emoji]
verify_jwt = false

# Called by Slack, which signs each request; the function verifies that
# signature itself (SLACK_SIGNING_SECRET).
[functions.slack-command]
verify_jwt = false

# Slack's OAuth redirect after "Add to Slack"; a plain browser GET.
[functions.slack-oauth]
verify_jwt = false
